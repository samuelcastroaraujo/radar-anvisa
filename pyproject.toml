[project]
name = "radar-anvisa"
version = "0.1.0"
description = "Chatbot regulatório com base de conhecimento viva sobre normativa e notícias da ANVISA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pymupdf>=1.24",
    "asyncpg>=0.30",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "openai>=1.54",
    "tenacity>=9.0",
    "tiktoken>=0.14.0",
    "curl-cffi>=0.16.3",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "asyncpg-stubs>=0.30",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = "^research/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# golden_qa faz chamadas reais de LLM (~30 perguntas, ~3 min, custo real) —
# fora do "pytest -q" do dia a dia por padrão; rodar de propósito com
# `uv run pytest -m golden_qa` (o teste já se pula sozinho sem credenciais).
addopts = "-m \"not golden_qa\""
markers = ["golden_qa: regressão de qualidade do RAG contra banco e LLM reais (seção 10)"]
